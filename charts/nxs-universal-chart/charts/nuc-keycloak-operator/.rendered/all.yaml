# Source: nuc-keycloak-operator/templates/keycloak.yaml
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: primary
  namespace: identity
  labels:

    app.kubernetes.io/instance: smoke
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: keycloak-platform
    app.kubernetes.io/version: 26.6.1
    component: keycloak
    helm.sh/chart: nuc-keycloak-operator-1.0.0
    platform: iam
  annotations:

    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "1"
    note: primary
    team: platform
spec:

  bootstrapAdmin:
    service:
      secret: keycloak-bootstrap-service
    user:
      secret: keycloak-bootstrap-admin
  db:
    database: keycloak
    host: postgres-rw.identity.svc
    passwordSecret:
      key: password
      name: keycloak-db
    port: 5432
    usernameSecret:
      key: username
      name: keycloak-db
    vendor: postgres
  http:
    httpEnabled: true
    httpPort: 8080
  image: quay.io/keycloak/keycloak:26.6.1
  ingress:
    className: nginx
    enabled: true
  instances: 1
