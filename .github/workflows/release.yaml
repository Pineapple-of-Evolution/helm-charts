name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install chart-releaser
        run: |
          curl -sSLo cr.tar.gz https://github.com/helm/chart-releaser/releases/download/v1.7.0/chart-releaser_1.7.0_linux_amd64.tar.gz
          tar -xzf cr.tar.gz
          sudo mv cr /usr/local/bin/cr

      - name: Package charts
        run: |
          mkdir -p .cr-release-packages
          shopt -s nullglob
          for chart in charts/*/; do
            if [[ -f "${chart}Chart.yaml" ]]; then
              helm package "$chart" --destination .cr-release-packages
            fi
          done

      - name: Publish charts
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${{ github.repository_owner }}"
          repo="${GITHUB_REPOSITORY#*/}"
          cr upload --owner "$owner" --git-repo "$repo" --commit "${{ github.sha }}" --skip-existing
          cr index --owner "$owner" --git-repo "$repo" --push
